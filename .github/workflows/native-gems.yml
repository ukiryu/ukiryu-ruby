name: native-gems

# Precompiled native gems, the parsanol-ruby gem-build layout: for each
# platform in release/platforms.json, oxidize-rb/cross-gem runs
# `rake native:<platform> gem` in rb-sys-dock, which compiles
# ext/ukiryu_native for every supported Ruby minor version and vendors that
# platform's cdylib for the ffi tier (see Rakefile). Each gem is then
# installed into a clean GEM_HOME on a runner of its own platform, and
# spec/native runs against the installed copy. A platform entry may narrow
# the Ruby minors with ruby_versions (Windows on ARM Ruby starts at 3.4). The gems are workflow
# artifacts only: no `gem push`, no credentials.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gems-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSIONS: "3.2,3.3,3.4,4.0"

jobs:
  platforms:
    name: platform list
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "matrix=$(jq -c '.platforms' release/platforms.json)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # rb-sys-dock bind-mounts the host's cargo registry and git caches,
      # which do not exist on a runner that has not run cargo.
      - name: Cargo cache directories for rb-sys-dock
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      - uses: oxidize-rb/actions/cross-gem@v1.5.0
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ matrix.ruby_versions || env.RUBY_VERSIONS }}
      - name: Gem contents
        shell: bash
        env:
          RUBY_VERSIONS: ${{ matrix.ruby_versions || env.RUBY_VERSIONS }}
        run: |
          gem="${{ steps.cross-gem.outputs.gem-path }}"
          tar -xOf "$gem" data.tar.gz | tar -tz | tee files.txt
          grep -qx "lib/ukiryu/ffi/${{ matrix.library }}" files.txt || { echo "::error::cdylib not vendored"; exit 1; }
          for v in ${RUBY_VERSIONS//,/ }; do
            grep -Eq "^lib/ukiryu/$v/ukiryu_native\.(so|bundle|dll)$" files.txt || { echo "::error::no extension for Ruby $v"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.platform }})
    needs: [platforms, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg
      - uses: ruby/setup-ruby@v1
        if: ${{ !matrix.container }}
        with:
          ruby-version: "3.4"
      - name: Install into a clean GEM_HOME
        if: ${{ !matrix.container }}
        shell: bash
        run: |
          export GEM_HOME="$RUNNER_TEMP/gemhome" GEM_PATH="$RUNNER_TEMP/gemhome"
          gem install --no-document rspec
          gem install --no-document --verbose pkg/*.gem
          gem list ukiryu
      - name: Native specs against the installed gem
        if: ${{ !matrix.container }}
        shell: bash
        env:
          UKIRYU_CHECKOUT_ROOT: ${{ github.workspace }}
        run: |
          export GEM_HOME="$RUNNER_TEMP/gemhome" GEM_PATH="$RUNNER_TEMP/gemhome"
          mkdir -p "$RUNNER_TEMP/run/specs"
          cp -R spec/native "$RUNNER_TEMP/run/specs/"
          cd "$RUNNER_TEMP/run/specs"
          ruby -rrspec/core -e 'exit RSpec::Core::Runner.run(ARGV)' -- --format documentation native
      # musl gems cannot be installed on the glibc host Ruby: install and run
      # the same specs inside an Alpine Ruby container.
      - name: Install and run native specs (musl container)
        if: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD:/ruby-consumer:ro" \
            -e UKIRYU_CHECKOUT_ROOT=/ruby-consumer ${{ matrix.container }} sh -ec '
            apk add --no-cache build-base libffi-dev
            export GEM_HOME=/tmp/gemhome GEM_PATH=/tmp/gemhome
            gem install --no-document rspec
            gem install --no-document --verbose /pkg/*.gem
            gem list ukiryu
            mkdir -p /tmp/run/specs
            cp -R /ruby-consumer/spec/native /tmp/run/specs/native
            cd /tmp/run/specs
            ruby -rrspec/core -e "exit RSpec::Core::Runner.run(ARGV)" -- --format documentation native
          '

  docker-cli:
    name: Docker CLI (${{ matrix.libc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {libc: gnu, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {libc: musl, os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
    steps:
      - uses: actions/checkout@v4
      - name: Read the gem's qualified core revision
        id: core
        shell: bash
        run: |
          rev=$(sed -n 's/.*ukiryu-rs?rev=[0-9a-f]*#\([0-9a-f]\{40\}\).*/\1/p' Cargo.lock | head -1)
          test -n "$rev"
          echo "ref=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ukiryu/ukiryu-rs
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the CLI from the gem's own core pin
        working-directory: core
        env:
          CLI_TARGET: ${{ matrix.target }}
          CARGO_BUILD_JOBS: 2
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release -p ukiryu-cli --target "$CLI_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-cli-${{ matrix.libc }}
          path: core/target/${{ matrix.target }}/release/ukiryu
          if-no-files-found: error

  docker:
    name: Native gem and CLI (${{ matrix.platform }})
    needs: [build, docker-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: alpine, libc: musl, gem: x86_64-linux-musl}
          - {platform: ubuntu-22, libc: gnu, gem: x86_64-linux}
          - {platform: ubuntu-24, libc: gnu, gem: x86_64-linux}
          - {platform: debian-bookworm, libc: gnu, gem: x86_64-linux}
          - {platform: debian-trixie, libc: gnu, gem: x86_64-linux}
    steps:
      - uses: actions/checkout@v4
      - name: Read the gem's qualified core revision
        id: core
        shell: bash
        run: |
          rev=$(sed -n 's/.*ukiryu-rs?rev=[0-9a-f]*#\([0-9a-f]\{40\}\).*/\1/p' Cargo.lock | head -1)
          test -n "$rev"
          echo "ref=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ukiryu/ukiryu-rs
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - uses: actions/checkout@v4
        with:
          repository: ukiryu/register
          ref: 63c0997355e59afcecef6c45a2c949f0dd199c93
          path: register
      - uses: actions/download-artifact@v4
        with:
          name: native-gem-${{ matrix.gem }}
          path: pkg
      - uses: actions/download-artifact@v4
        with:
          name: docker-cli-${{ matrix.libc }}
          path: bin
      - name: Run installed native gem and Rust CLI in the distro
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          LOGDIR: ${{ runner.temp }}/docker-test-logs
        run: |
          chmod +x bin/ukiryu
          bash scripts/docker-test-all.sh --binary-gnu "$PWD/bin/ukiryu" --binary-musl "$PWD/bin/ukiryu" \
            --gems-gnu "$PWD/pkg" --gems-musl "$PWD/pkg" --register "$PWD/register" --core "$PWD/core" "$PLATFORM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-native-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/docker-test-logs
          if-no-files-found: warn
