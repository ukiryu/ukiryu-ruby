[package]
name = "ukiryu_cdylib"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
description = "Vendored cdylib for ukiryu platform gems: the core's C ABI for the Ruby ffi tier"
license = "BSD-2-Clause"
repository = "https://github.com/ukiryu/ukiryu-ruby"
publish = false

[lib]
name = "ukiryu"
crate-type = ["cdylib"]
doc = false

[dependencies]
# DEVELOPMENT PIN, NOT THE SHIPPED FORM. No ukiryu crate is published yet, so
# this follows ukiryu/ukiryu-rs at the same commit as ext/ukiryu_native
# (CLI capture, core-backed Ruby caches and shell factory),
# so both tiers of a gem run one core.
# A gem built from this manifest
# does not qualify for release: before release this must become the crates.io
# dependency, for example
#   ukiryu = { version = "=0.1.0", features = ["c"] }
# with a comment naming the ukiryu-rs release that carries each fix.
# Core-backed Ruby caches and shell factory: ukiryu/ukiryu-rs#116.
ukiryu = { git = "https://github.com/ukiryu/ukiryu-rs", rev = "da867384a162bf8f22ea7245cda808cbb123e2e7", features = ["c"] }
ukiryu-cli = { git = "https://github.com/ukiryu/ukiryu-rs", rev = "da867384a162bf8f22ea7245cda808cbb123e2e7" }
